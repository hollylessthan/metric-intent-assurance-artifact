name: artifact-ci
on:
  push:
  pull_request:

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: python -m compileall -q src scripts
      - run: python scripts/verify_sealed_artifacts.py
      - run: |
          python -m unittest \
            tests.test_evaluation \
            tests.test_mia_v2_preflight \
            tests.test_mia_v2_readiness_audit \
            tests.test_v2_matched_baselines

  paper-evidence-reproduction:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: python -m compileall -q src scripts
      - name: Recompute paper quantitative evidence from public release assets
        run: bash scripts/reproduce_paper.sh
