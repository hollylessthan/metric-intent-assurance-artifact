[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-intent-assurance"
version = "0.2.0"
description = "Registry-neutral reference system for Metric Intent Assurance research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8.0"]
duckdb = ["duckdb>=1.0"]

[project.scripts]
mia = "mia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
